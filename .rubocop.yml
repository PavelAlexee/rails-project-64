require:
  - rubocop-rails
  - rubocop-minitest
  - rubocop-performance


AllCops:
  DisplayCopNames: true
  Exclude:
    - "bin/**"
    - "db/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "config/**/*"
    - "tmp/**/*"
  NewCops: enable

Layout/LineLength:
  Enabled: false

Rails/UniqueValidationWithoutIndex:
  Enabled: false
  
Minitest/MultipleAssertions:
  Max: 5 

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Rails:
  Enabled: true

Rails/InverseOf:  
  Enabled: false

Style/AsciiComments:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false
